name: saff_app
description: Saff, an alarm app where a small group wakes up together into a short duel.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mode_arcade: any
  mode_card_duel: any
  mode_selfie: any
  mode_word: any
  saff_alarm: any
  saff_core: any
  saff_domain: any
  saff_modes: any
  saff_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
