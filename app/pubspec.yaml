name: saff_app
description: Saff, an alarm app where a small group wakes up together into a short duel.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

resolution: workspace

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.1
  intl: any
  url_launcher: ^6.3.0
  mode_arcade: any
  mode_card_duel: any
  mode_selfie: any
  mode_word: any
  saff_alarm: any
  saff_core: any
  saff_domain: any
  saff_modes: any
  saff_ui: any
  shared_preferences: ^2.3.0

  riverpod: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
