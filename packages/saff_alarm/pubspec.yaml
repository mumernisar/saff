name: saff_alarm
description: Alarm plugin, Dart API and Android implementation.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.3.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  saff_core: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.saff.saff_alarm
        pluginClass: SaffAlarmPlugin
