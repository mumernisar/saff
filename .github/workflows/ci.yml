name: ci

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "21" }
      - name: Read pinned Flutter version
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: dart pub global activate melos
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Generate and fail on diff
        run: |
          melos run generate
          git diff --exit-code
      - run: melos run format:check
      - run: melos run analyze
      - run: melos run test
      - name: Dev debug APK
        run: cd app && flutter build apk --debug --flavor dev -t lib/main_dev.dart

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "21" }
      - run: npm ci
        working-directory: functions
      - run: npm run lint && npm run typecheck
        working-directory: functions

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "21" }
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: firebase/rules-tests
      - run: npm run test:rules
